# Release workflow for epack-collector-microsoft-cloud
# Triggers on version tags (v*) and builds with SLSA Level 3 provenance.

name: Release

on:
  push:
    tags:
      - "v*"

permissions: read-all

jobs:
  test:
    uses: ./.github/workflows/ci.yaml

  args:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ldflags.outputs.version }}
      commit: ${{ steps.ldflags.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: ldflags
        run: |
          echo "version=$(git describe --tags --always --dirty | sed 's/^v//')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, args]
    permissions:
      id-token: write
      contents: write
      actions: read
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.1.0
    with:
      go-version-file: go.mod
      config-file: .slsa-goreleaser/epack-collector-microsoft-cloud-${{ matrix.os }}-${{ matrix.arch }}.yml
      evaluated-envs: "VERSION:${{ needs.args.outputs.version }},COMMIT:${{ needs.args.outputs.commit }}"
      upload-assets: false

  release:
    needs: [args, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f \( -name "epack-collector-microsoft-cloud-*" -o -name "*.intoto.jsonl" \) -exec mv {} release/ \;
          cd release
          for f in *.intoto.jsonl; do
            [ -f "$f" ] && mv "$f" "${f%.intoto.jsonl}.sigstore.json"
          done
          sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          target_commitish: ${{ needs.args.outputs.commit }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
