name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Verify binary metadata
        run: |
          ./epack-collector-microsoft-cloud --version
          ./epack-collector-microsoft-cloud --capabilities
