name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  collector:
    uses: locktivity/epack/.github/workflows/collector-ci.yaml@main
    with:
      name: microsoft-cloud
      # The tests run close to 10 minutes under the race detector.
      test-timeout: 30m
      profile-url: ${{ vars.EVIDENCE_PROFILE_URL }}
      conformance-secrets: AZURE_CLIENT_SECRET
      checks: |
        ./scripts/check-no-beta-urls.sh
        make lint-secret-leak
