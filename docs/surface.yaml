scope:
  methods: [get]

overview:
  - title: Devices
    says: >-
      Intune managed devices and their compliance state, Entra registered and
      joined devices, and Defender for Endpoint machines with their sensor and
      antivirus health. The Intune API requires an Intune license. The
      collector writes no endpoint-posture file.
    items: [Devices]
  - title: Vulnerability findings
    items: [Vulnerability findings]
  - title: Identity governance and privileged access
    says: >-
      Access reviews, entitlement management, privileged access for groups,
      lifecycle workflows and terms of use, and the assignment and eligibility
      schedules in Privileged Identity Management. Most need Microsoft Entra
      ID Governance or P2 licensing.
    items: [Identity governance, Privileged Identity Management schedules]
  - title: Tenant policies, groups and app permissions
    says: >-
      The authorization, authentication methods, cross-tenant access and
      consent policies, named locations and authentication strengths, groups
      and their members, the permissions granted to each application,
      administrative units, domains and federation. The collector reads the
      user, application and service principal lists, the conditional access
      policies, security defaults, role assignments and the authentication
      method registration report.
    items: [Tenant-wide policies, Conditional access detail, Groups, App permissions and ownership, Directory settings]
  - title: Defender for Cloud, roles, policies and logs
    says: >-
      Which Defender for Cloud plans are on and its other settings, Defender
      XDR incidents and alerts, Identity Protection risk detections, role and
      policy definitions and assignments on scopes other than the
      subscription, policy compliance per resource, and the directory audit,
      provisioning and sign-in logs. The collector reads the secure scores,
      Defender for Cloud's assessments, and the subscription's role and policy
      assignments.
    items: [Defender plans, Defender for Cloud settings, Defender XDR and attack simulation, Identity Protection and risk, Role definitions and assignments at other scopes, Policy definitions and assignments at other scopes, Policy compliance detail, Logs]
  - title: Azure resource settings
    says: >-
      Each SQL server's auditing, firewall and threat protection settings,
      storage accounts' service and network settings, Key Vault access
      policies and contents, virtual networks, firewalls and private
      endpoints, virtual machine extensions and disks, and backup
      configuration. The collector lists these resources with the settings its
      cloud-posture and access-posture fields need.
    items: [Azure SQL settings, Storage account settings, Key Vault settings and contents, Network resources beyond security groups and public IPs, Virtual machine configuration, Backup configuration and history]
  - title: Other databases and Microsoft 365 settings
    says: >-
      Azure Database for PostgreSQL, MySQL and Cosmos DB, Exchange, SharePoint
      and Teams admin settings, Purview compliance, External ID user flows,
      and partner delegated admin relationships. The collector reads Azure SQL
      only among databases.
    items: [Other databases, Microsoft 365 service settings, Purview compliance, External identities and authentication flows, Partner and multi-tenant relationships]

not_collected:
  - title: Devices
    says: >-
      Intune managed devices and their compliance state, device configuration
      and compliance policies, enrollment configurations, app protection and
      app configuration policies, Entra registered and joined devices,
      BitLocker recovery keys, device local administrator credentials and the
      Windows update deployment service. Defender for Endpoint machines with
      their sensor and antivirus health come from the Defender API, outside
      these descriptions. The Intune API requires an Intune license. The
      collector writes no endpoint-posture file.
    paths: ["/deviceManagement*", "/deviceAppManagement*", "/devices*", "/devices(*", "/informationProtection/bitlocker*", "/directory/deviceLocalCredentials*", "/admin/configurationManagement*", "/reports/managedDeviceEnrollment*", "/reports/getDeviceManagement*", "/users/{user-id}/managedDevices*", "/users/{user-id}/ownedDevices*", "/users/{user-id}/registeredDevices*", "/users/{user-id}/managedAppRegistrations*", "/users/{user-id}/deviceManagementTroubleshootingEvents*"]
  - title: Vulnerability findings
    says: >-
      Open vulnerabilities and their severity from Defender Vulnerability
      Management and Defender for Cloud, which come from the Defender API and
      Azure, outside these descriptions. The collector writes no
      vuln-scanning file. The Azure artifact's defender.unpatched_pct comes
      from the healthy or unhealthy status of Defender for Cloud's update and
      vulnerability assessments.
  - title: Identity governance
    says: >-
      Microsoft Entra ID Governance: access reviews and their decisions,
      entitlement management catalogs, access packages and assignment
      policies, privileged access for groups, lifecycle workflows, terms of
      use and their acceptances, and app consent requests. Most need
      Microsoft Entra ID Governance or P2 licensing.
    paths: ["/identityGovernance*", "/roleManagement/entitlementManagement*", "/agreements*", "/agreementAcceptances*", "/users/{user-id}/agreementAcceptances*"]
  - title: Privileged Identity Management schedules
    says: >-
      Role assignment schedules, their instances and the requests behind
      them, eligibility schedule instances and requests, and approvals, in
      Privileged Identity Management. The collector reads the current role
      assignments, the role definitions and the eligibility schedules.
    paths: ["/roleManagement/directory/roleAssignmentSchedule*", "/roleManagement/directory/roleEligibilityScheduleInstances*", "/roleManagement/directory/roleEligibilityScheduleRequests*", "/roleManagement/directory/roleAssignmentApprovals*", "/roleManagement/directory/transitiveRoleAssignments*"]
  - title: Tenant-wide policies
    says: >-
      The tenant's authorization policy, authentication methods policy and
      configurations, authentication strengths, cross-tenant access settings,
      app management and permission grant policies, the admin consent request
      policy, token lifetime and issuance policies, claims mapping and home
      realm discovery policies, the device registration policy, feature
      rollout policies and the certificate-based authentication
      configuration. The collector reads the security defaults policy and the
      conditional access policies.
    paths: ["/policies*", "/authenticationMethodsPolicy*", "/authenticationMethodConfigurations*", "/certificateBasedAuthConfiguration*", "/organization/{organization-id}/certificateBasedAuthConfiguration*", "/directory/publicKeyInfrastructure*"]
  - title: Conditional access detail
    says: >-
      Named locations, authentication strengths, authentication context
      classes and the policy templates for conditional access. The collector
      reads the conditional access policies themselves.
    paths: ["/identity/conditionalAccess*"]
  - title: Groups
    says: >-
      Security and Microsoft 365 groups: their members and owners, transitive
      membership, dynamic membership rules, settings and setting templates,
      lifecycle policies, and the app roles and permissions granted to them.
      The collector reads no groups.
    paths: ["/groups", "/groups/{group-id}", "/groups/{group-id}/members*", "/groups/{group-id}/transitiveMembers*", "/groups/{group-id}/owners*", "/groups/{group-id}/memberOf*", "/groups/{group-id}/transitiveMemberOf*", "/groups/{group-id}/settings*", "/groups/{group-id}/appRoleAssignments*", "/groups/{group-id}/permissionGrants*", "/groups/{group-id}/membersWithLicenseErrors*", "/groups/{group-id}/getMemberGroups*", "/groups/{group-id}/getMemberObjects*", "/groups/{group-id}/checkMember*", "/groups/delta()", "/groups/$count", "/groups(*", "/groupSettings*", "/groupSettingTemplates*", "/groupLifecyclePolicies*", "/users/{user-id}/memberOf*", "/users/{user-id}/transitiveMemberOf*", "/users/{user-id}/joinedGroups*"]
  - title: App permissions and ownership
    says: >-
      The permissions granted to each application and service principal, as
      OAuth 2.0 consents and app role assignments, their owners, federated
      identity credentials, synchronization jobs and the policies assigned to
      them, and each user's app role assignments and consents. The collector
      reads the application and service principal lists, with their
      credentials.
    paths: ["/oauth2PermissionGrants*", "/permissionGrants*", "/servicePrincipals/{servicePrincipal-id}/appRoleAssign*", "/servicePrincipals/{servicePrincipal-id}/oauth2PermissionGrants*", "/servicePrincipals/{servicePrincipal-id}/owners*", "/servicePrincipals/{servicePrincipal-id}/delegatedPermissionClassifications*", "/servicePrincipals/{servicePrincipal-id}/synchronization*", "/servicePrincipals/{servicePrincipal-id}/remoteDesktopSecurityConfiguration*", "/servicePrincipals/{servicePrincipal-id}/claimsMappingPolicies*", "/servicePrincipals/{servicePrincipal-id}/homeRealmDiscoveryPolicies*", "/servicePrincipals/{servicePrincipal-id}/tokenIssuancePolicies*", "/servicePrincipals/{servicePrincipal-id}/tokenLifetimePolicies*", "/servicePrincipals/{servicePrincipal-id}/memberOf*", "/servicePrincipals/{servicePrincipal-id}/transitiveMemberOf*", "/servicePrincipals/{servicePrincipal-id}/ownedObjects*", "/servicePrincipals/{servicePrincipal-id}/createdObjects*", "/applications/{application-id}/owners*", "/applications/{application-id}/federatedIdentityCredentials*", "/applications/{application-id}/tokenIssuancePolicies*", "/applications/{application-id}/tokenLifetimePolicies*", "/applications/{application-id}/synchronization*", "/applications/{application-id}/appManagementPolicies*", "/applications/{application-id}/extensionProperties*", "/applications/{application-id}/owners*", "/users/{user-id}/appRoleAssignments*", "/users/{user-id}/oauth2PermissionGrants*", "/users/{user-id}/permissionGrants*", "/users/{user-id}/ownedObjects*", "/users/{user-id}/createdObjects*"]
  - title: Users' authentication methods and detail
    says: >-
      Each user's registered authentication methods and sign-in preferences,
      licenses, manager and reports, sponsors and scoped role memberships,
      read per user. The collector reads the user list with sign-in activity
      and the authentication method registration report.
    paths: ["/users/{user-id}/authentication*", "/users/{user-id}/licenseDetails*", "/users/{user-id}/manager*", "/users/{user-id}/directReports*", "/users/{user-id}/transitiveReports*", "/users/{user-id}/sponsors*", "/users/{user-id}/scopedRoleMemberOf*", "/users/{user-id}/getMemberGroups*", "/users/{user-id}/getMemberObjects*", "/users/{user-id}/checkMember*"]
  - title: Directory settings
    says: >-
      Administrative units and their scoped role members, verified domains
      with their authentication type and DNS records, federation
      configurations, custom security attributes, on-premises synchronization
      settings, deleted objects and the directory's recovery settings, the
      tenant's subscribed licenses, and its subscriptions.
    paths: ["/directory*", "/scopedRoleMemberships*", "/domains*", "/domainDnsRecords*", "/subscribedSkus*", "/directoryObjects*"]
  - title: Partner and multi-tenant relationships
    says: >-
      Delegated admin relationships with partners and the access they grant,
      delegated admin customers, partner contracts, and multi-tenant
      organization membership.
    paths: ["/tenantRelationships*", "/contracts*"]
  - title: Logs
    says: >-
      Directory audit logs, provisioning logs and sign-in logs, and the
      Defender XDR audit log queries. The collector reads each user's last
      sign-in through the user list.
    paths: ["/auditLogs*", "/security/auditLog*"]
  - title: Defender XDR and attack simulation
    says: >-
      Defender XDR incidents and alerts, detection rules and alert
      collaboration, Defender for Identity sensors and health issues, attack
      simulation campaigns, training and their reports. The collector reads
      the secure scores.
    paths: ["/security*", "/reports/security*"]
  - title: Identity Protection and risk
    says: >-
      Risky users, risky service principals, risk detections and the risk
      prevention settings of Identity Protection.
    paths: ["/identityProtection*", "/identity/riskPrevention*"]
  - title: External identities and authentication flows
    says: >-
      External ID user flows and their attributes, identity providers, API
      connectors, custom authentication extensions, authentication event
      flows and listeners, and Verified ID.
    paths: ["/identity/b2xUserFlows*", "/identity/userFlowAttributes*", "/identity/identityProviders*", "/identity/apiConnectors*", "/identity/authenticationEventsFlows*", "/identity/customAuthenticationExtensions*", "/identity/authenticationEventListeners*", "/identity/verifiedId*", "/invitations*"]
  - title: Purview compliance
    says: >-
      Sensitivity labels, subject rights requests, data security and
      governance settings, eDiscovery cases, information protection and
      threat assessments, privacy requests and data policy operations.
    paths: ["/security/labels*", "/security/subjectRightsRequests*", "/security/dataSecurityAndGovernance*", "/security/cases*", "/security/informationProtection*", "/informationProtection*", "/privacy*", "/compliance*", "/dataPolicyOperations*", "/users/{user-id}/dataSecurityAndGovernance*", "/users/{user-id}/informationProtection*", "/users/{user-id}/security*"]
  - title: Microsoft 365 service settings
    says: >-
      Exchange Online, SharePoint and Teams admin settings, service
      announcements and health, Edge policies, people settings and the
      Microsoft 365 Apps settings.
    paths: ["/admin*"]
  - title: Defender plans
    says: >-
      Which Defender for Cloud plans, such as Defender for Servers, are on for
      each subscription. The cloud-posture file has no threat_detection value.
    path_contains: ["/providers/Microsoft.Security/pricings"]
  - title: Defender for Cloud settings
    says: >-
      Auto-provisioning and workspace settings, security contacts, alerts and
      their suppression rules, secure score controls and their definitions,
      regulatory compliance standards and their assessment results,
      assessment metadata and sub-assessments, adaptive network hardening,
      just-in-time access policies and device security groups. The collector
      reads the secure score and the assessments.
    path_contains: ["/providers/Microsoft.Security/"]
  - title: Azure SQL settings
    says: >-
      Each SQL server's Microsoft Entra administrator, auditing and extended
      auditing settings, firewall and virtual network rules, private endpoint
      connections, advanced threat protection, vulnerability assessments,
      encryption protector and keys, DNS aliases and failover groups, each
      database's auditing, threat protection, vulnerability assessment,
      sensitivity labels, backup retention and ledger settings, and managed
      instances with the same. The collector reads the servers, their
      databases and each database's transparent data encryption.
    path_contains: ["/providers/Microsoft.Sql/"]
  - title: Storage account settings
    says: >-
      Each storage account's blob, file, queue and table service properties,
      containers and shares with their immutability and legal hold settings,
      encryption scopes, management and object replication policies, private
      endpoint connections, network rules, local users and blob inventory
      policies. The collector lists the accounts, reading their public network
      access, TLS version, shared key and blob public access settings.
    path_contains: ["/providers/Microsoft.Storage/"]
  - title: Key Vault settings and contents
    says: >-
      Each vault's access policies, keys, secrets and certificates as
      management-plane metadata, managed HSMs and their keys, private endpoint
      connections and deleted vaults. The collector lists the vaults, reading
      their RBAC, soft delete, purge protection and public network access
      settings.
    path_contains: ["/providers/Microsoft.KeyVault/"]
  - title: Network resources beyond security groups and public IPs
    says: >-
      Virtual networks and subnets, network interfaces, firewalls and
      firewall policies, application gateways and load balancers, private
      endpoints and private link services, VPN and ExpressRoute gateways,
      virtual WANs and hubs, route tables, DDoS protection plans, Network
      Watcher and the network manager. The collector lists the network
      security groups with their rules and the public IP addresses.
    path_contains: ["/providers/Microsoft.Network/"]
  - title: Virtual machine configuration
    says: >-
      Each virtual machine's extensions, disks, run commands and instance
      view, scale sets and their instances, images and galleries, dedicated
      hosts and SSH public keys. The collector lists the virtual machines.
    path_contains: ["/providers/Microsoft.Compute/"]
  - title: Backup configuration and history
    says: >-
      Each Recovery Services vault's settings and configuration, backup
      engines, protection containers and intent, recovery points, resource
      guard proxies and private endpoint connections. The collector lists the
      vaults with their protected items, policies and recent jobs.
    path_contains: ["/providers/Microsoft.RecoveryServices/"]
  - title: Role definitions and assignments at other scopes
    says: >-
      Role definitions, deny assignments, role assignments on management
      groups, resource groups and resources, classic administrators and the
      permissions and operations each provider defines. The collector reads
      the subscription's role assignments.
    path_contains: ["/providers/Microsoft.Authorization/roleDefinitions", "/providers/Microsoft.Authorization/roleAssignments", "/providers/Microsoft.Authorization/denyAssignments", "/providers/Microsoft.Authorization/classicAdministrators", "/providers/Microsoft.Authorization/permissions", "/providers/Microsoft.Authorization/providerOperations", "/providers/Microsoft.Authorization/elevateAccess"]
    paths: ["/{roleAssignmentId}", "/{denyAssignmentId}"]
  - title: Policy definitions and assignments at other scopes
    says: >-
      Policy and initiative definitions, built-in and custom, policy
      exemptions, and policy assignments on management groups, resource groups
      and resources. The collector reads the subscription's policy
      assignments and their compliance summary.
    path_contains: ["/providers/Microsoft.Authorization/policyDefinitions", "/providers/Microsoft.Authorization/policySetDefinitions", "/providers/Microsoft.Authorization/policyExemptions", "/providers/Microsoft.Authorization/policyAssignments", "/providers/Microsoft.Management/"]
    paths: ["/{policyAssignmentId}"]
  - title: Policy compliance detail
    says: >-
      Policy compliance per resource and per policy, policy events,
      remediations, attestations and the policy metadata. The collector
      reads the subscription-level compliance summary.
    path_contains: ["/providers/Microsoft.PolicyInsights/"]
  - title: Other databases
    says: >-
      Azure Database for PostgreSQL, Azure Database for MySQL and Azure Cosmos
      DB. The collector reads Azure SQL only.

